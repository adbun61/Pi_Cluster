---
- name: Deploy apps from repository
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig: "~/.kube/config" 
    playbook_dir: "~/Pi_Cluster"

  tasks:

    - name: Ensure Namespace exisits
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        name: "{{ item }}"
        kind: Namespace
        state: present
      loop:
        - Longhorn
        - gitea
        - linkding
        - monitoring

    - name: Find all yaml files inside apps folder
      find:
        paths: "~/Pi_Cluster/k8s-manifests"
        patterns: "*.yaml"
        recurse: yes
      register: app_manifests

    - name: Apply manifests to cluster
      kubernetes.core.k8s:
        state: present
        src: "{{ item.path }}"
      loop: "{{ app_manifests.files }}"

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: "https://charts.longhorn.io"

    - name: Add Grafana Helm repo
      kubernetes.core.helm_repository:
        name: grafana
        repo_url: "https://grafana.github.io/helm-charts"

    - name: Add Promethus Helm repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: "https://prometheus-community.github.io/helm-charts"

    - name: Add Gitea Helm repo
      kubernetes.core.helm_repository:
        name: gitea
        repo_url: "https://dl.gitea.com/charts/"

    - name: Install Longhorn release
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: longhorn-system
        kubeconfig: "{{ kubeconfig_path }}"
        wait: true
        timeout: "600s"

    - name: Deploy Promethus Stack wirh Grafana   
      kubernetes.core.helm:
        name: kube-prom-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        create_namespace: true
        update_repo_cache: true
        values_files:
          - "{{ playbook_dir }}/../helm-values/grafana-values.yml"
        kubeconfig: "~/.kube/config"

    - name: Deploy Gitea release using Helm
      kubernetes.core.helm:
        name: gitea
        chart_ref: gitea-charts/gitea
        release_namespace: gitea
        state: present
        create_namespace: true
        values_files:
          - "{{ playbook_dir }}/../helm-values/gitea-values.yml"
